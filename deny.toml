# Dependency licenses and advisories; git2 / libgit2 are forbidden.
[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "CC0-1.0",
]

# GPLv3 applies to workspace crates; dependency licenses are listed above.
[[licenses.exceptions]]
name = "gitmini"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "gitmini-core"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "gitmini-bridge"
allow = ["GPL-3.0-only"]

[bans]
multiple-versions = "warn"
deny = [
    { name = "git2" },
    { name = "libgit2-sys" },
]

[advisories]
version = 2
yanked = "warn"
# Tauri's GTK3 and urlpattern stacks still require these packages. These are
# maintenance notices, not vulnerability exemptions; remove each when upstream
# replaces the dependency. See https://rustsec.org/advisories/<ID>.html.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.x is required by Tauri's GTK3 glib-macros 0.18; no patched release exists" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property is required by Tauri's urlpattern 0.3 through unic-ucd-ident; no patched release exists" },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range is required by Tauri's urlpattern 0.3 Unicode stack; no patched release exists" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common is required by Tauri's urlpattern 0.3 Unicode stack; no patched release exists" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident is required by Tauri's urlpattern 0.3; no patched release exists" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version is required by Tauri's urlpattern 0.3 Unicode stack; no patched release exists" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
