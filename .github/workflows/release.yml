# Create a verified draft. Publish manually after the installation/update smoke checks in docs/releases.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.1.0"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  NODE_VERSION: "24"
  # Same values as ci.yml (checked by its lint job).
  RUST_TOOLCHAIN: "1.99.0"
  TAURI_CLI_VERSION: "2.12.1"
  CARGO_TERM_COLOR: always
  VITE_GITMINI_GITHUB_LOGIN: "0"
  GITMINI_UPDATER_ENDPOINT: ${{ vars.GITMINI_UPDATER_ENDPOINT || format('https://github.com/{0}/releases/latest/download/latest.json', github.repository) }}
  GITMINI_UPDATER_PUBKEY: ${{ vars.GITMINI_UPDATER_PUBKEY }}

jobs:
  # Every later job builds the commit resolved here, so moving the tag during the run changes nothing.
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # The release key lives in the `release` environment, out of reach of this job: sign-updater checks it.
      HAS_UPDATER_KEY: "true"
    steps:
      - name: Require a tag on the default branch with a successful ci check
        id: tag
        run: |
          read -r type sha < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          if [ "$type" = tag ]; then sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.object.sha')"; fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.sha')" = "$sha"
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$DEFAULT_BRANCH" --jq '.status')"
          case "$status" in
            identical|ahead) ;;
            *) echo "::error::$TAG ($sha) is not on $DEFAULT_BRANCH (compare: $status)"; exit 1 ;;
          esac
          # Only check runs created by GitHub Actions count: another app could publish a check named ci.
          conclusions="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=ci&filter=latest&per_page=100" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions") | .conclusion]')"
          echo "ci on $sha: $conclusions"
          if ! jq -e 'length > 0 and all(. == "success")' <<< "$conclusions" > /dev/null; then
            echo "::error::$TAG ($sha) has no successful ci check: wait for ci on $DEFAULT_BRANCH, then re-run this workflow"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate version and updater identity
        run: node scripts/updater-release.mjs check

  # Runs third-party npm and Cargo code, so it never sees the release key (see sign-updater).
  build:
    name: build (${{ matrix.id }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: macos-arm64, os: macos-14, args: "--target aarch64-apple-darwin", targets: aarch64-apple-darwin }
          - { id: macos-x64, os: macos-14, args: "--target x86_64-apple-darwin", targets: x86_64-apple-darwin }
          - { id: windows, os: windows-2022, args: "", targets: "" }
    env:
      HAS_UPDATER_KEY: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.id }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-binstall
      - name: Install Tauri CLI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall --no-confirm --locked tauri-cli --version '=${{ env.TAURI_CLI_VERSION }}'
      # Tauri needs a private key to produce the updater artifacts and tauri-action needs their signatures to write
      # latest.json. A key generated for this job only fills both; sign-updater replaces every signature.
      - name: Throwaway updater key
        shell: bash
        run: |
          password="$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('hex'))")"
          echo "::add-mask::$password"
          cargo tauri signer generate --ci --password "$password" --write-keys "$RUNNER_TEMP/throwaway.key" > /dev/null
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/throwaway.key")"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Configure signed updater artifacts
        run: node scripts/updater-release.mjs config
      - name: Build installers and update the draft
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tauriScript: cargo tauri
          tagName: ${{ env.TAG }}
          releaseName: gitmini ${{ env.TAG }}
          releaseBody: |
            macOS: ad hoc signed `.dmg` installers for Apple Silicon and Intel, without notarization.
            Windows: per-user `-setup.exe` installer (no administrator rights needed). Linux builds are paused for now.
            See `docs/code-signing-policy.md` for the signature status of the Windows installer.
            Automatic updates are signed with the gitmini updater key. Verify downloads with `SHA256SUMS`.
            See `docs/releases.md` for installation and verification instructions.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config "${{ env.GITMINI_RELEASE_CONFIG }}"
      # SignPath verifies that the artifact comes from this workflow run, so it is uploaded here, by the build.
      - name: Keep the unsigned Windows installer for SignPath
        if: matrix.id == 'windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  # Optional: runs only when SignPath is configured (docs/releases.md). The build job leaves an unsigned installer
  # in the draft; this job replaces it with the Authenticode-signed installer, which sign-updater then signs for
  # the updater. Without SignPath, the unsigned installer is published as is.
  sign-windows:
    name: sign (windows)
    needs: build
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: windows-2022
    timeout-minutes: 150
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find the unsigned installer artifact of this run
        id: unsigned
        run: |
          ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "unsigned-windows-installer") | .id')"
          test "$(printf '%s\n' "$ids" | grep -c .)" -eq 1
          echo "id=$ids" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      # Each request waits for a manual approval in SignPath (docs/code-signing-policy.md).
      - name: Submit the installer to SignPath
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.id }}
          parameters: |
            version: "${{ steps.unsigned.outputs.version }}"
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed
      - name: Verify the Authenticode signature
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem signed -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one signed installer, found $($installers.Count)" }
          $signature = Get-AuthenticodeSignature $installers[0].FullName
          if ($signature.Status -ne 'Valid') { throw "Authenticode status: $($signature.Status)" }
          if (-not $signature.TimeStamperCertificate) { throw 'The signature has no trusted timestamp' }
          "$($installers[0].Name) signed by $($signature.SignerCertificate.Subject)"
      # Its updater signature is now stale: sign-updater recomputes it over the signed bytes.
      - name: Replace the draft installer
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber signed/*-setup.exe

  # The only job that sees the release key. It installs no npm package and runs no build: only the pinned Tauri
  # CLI and scripts/updater-release.mjs (Node built-ins). The `release` environment holds the key and, once its
  # required reviewers are set (docs/releases.md), waits for an approval before starting.
  sign-updater:
    name: sign (updater)
    needs: [prepare, build, sign-windows]
    if: ${{ !cancelled() && needs.build.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.sign-windows.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-binstall
      - name: Install Tauri CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall --no-confirm --locked tauri-cli --version '=${{ env.TAURI_CLI_VERSION }}'
      - name: Download the updater artifacts
        run: |
          mkdir dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl --pattern latest.json --pattern '*.sig'
          node scripts/updater-release.mjs artifacts dl/latest.json > artifacts.txt
          mapfile -t names < artifacts.txt
          patterns=()
          for name in "${names[@]}"; do patterns+=(--pattern "$name"); done
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl "${patterns[@]}"
      - name: Sign with the release key and replace the signatures in the draft
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }
          mapfile -t names < artifacts.txt
          signatures=()
          for name in "${names[@]}"; do
            cargo tauri signer sign --app-version "${TAG#v}" "dl/$name"
            signatures+=("dl/$name.sig")
          done
          node scripts/updater-release.mjs resign dl
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${signatures[@]}" dl/latest.json

  verify-macos:
    needs: build
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify both macOS installers have valid ad hoc signatures
        shell: bash
        run: |
          mkdir dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --dir dl
          test "$(find dl -name '*.dmg' | wc -l | tr -d ' ')" = 2
          for dmg in dl/*.dmg; do
            mnt="$(mktemp -d)"
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
            app="$(find "$mnt" -maxdepth 1 -name '*.app' -print -quit)"
            test -n "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --display --verbose=4 "$app" 2>&1 | tee signature.txt
            grep -q '^Signature=adhoc$' signature.txt
            hdiutil detach "$mnt"
          done

  assets:
    needs: [prepare, sign-updater]
    # Explicit: a skipped sign-windows would otherwise skip this job too.
    if: ${{ !cancelled() && needs.sign-updater.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download the draft assets
        run: |
          mkdir dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl \
            --pattern '*.dmg' --pattern '*-setup.exe' \
            --pattern '*.app.tar.gz' --pattern '*.sig' --pattern 'latest.json'
          test "$(find dl -name '*-setup.exe' | wc -l)" -eq 1
      - name: Verify version, platform coverage, URLs and all updater signatures
        run: node scripts/updater-release.mjs verify dl
      - name: Generate and upload checksums
        working-directory: dl
        run: |
          sha256sum -- * | sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber SHA256SUMS

  ready:
    needs: [verify-macos, sign-windows, assets]
    if: ${{ !cancelled() && needs.verify-macos.result == 'success' && needs.assets.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Draft ready for manual installation and update checks
        env:
          WINDOWS_SIGNING: ${{ needs.sign-windows.result == 'success' && 'signed through SignPath' || 'NOT signed (SignPath is not configured)' }}
        run: |
          echo "Draft $TAG verified. Windows installer: $WINDOWS_SIGNING. Follow docs/releases.md before publishing manually." >> "$GITHUB_STEP_SUMMARY"
