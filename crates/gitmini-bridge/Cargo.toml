[package]
name = "gitmini-bridge"
description = "HTTP Development Bridge: Hosts gitmini-core and serves the frontend in an ordinary browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "gitmini_bridge"
path = "src/lib.rs"

[[bin]]
name = "gitmini-bridge"
path = "src/main.rs"

[dependencies]
gitmini-core = { path = "../gitmini-core" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7.19"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "std"] }

[dev-dependencies]
http-body-util = "0.1"
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
